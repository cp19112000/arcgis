<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản đồ 2D Công viên Gia Định – IE402 | Nhóm 1</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>" />

    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.29/"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="app-header">
      <div class="header-content">
        <div class="header-text">
          <h1 class="header-title">🌳 Bản đồ 2D Công viên Gia Định – LOD3.3</h1>
          <p class="header-subtitle">Hệ thống thông tin địa lý 3 chiều – IE402 | Nhóm 1: Công viên Gia Định, TP. Hồ Chí Minh</p>
        </div>
      </div>
    </header>

    <div id="viewDiv">
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Đang tải bản đồ Công viên Gia Định…</p>
      </div>
    </div>

    <div id="legend-panel">
      <div id="legend-toggle" onclick="toggleLegend()">📖 Chú giải</div>
      <div id="legend-container"></div>
    </div>

    <div id="info-panel">
      <div class="info-title">📐 LOD3.3 – Chi tiết kiến trúc</div>
      <div class="info-content">
        <span class="lod-badge">LOD3</span> Mặt bằng chi tiết: tường, mái, cửa sổ, cửa ra vào, cột
      </div>
    </div>

    <script src="js/park_boundary.js"></script>
    <script src="js/buildings_lod3.js"></script>
    <script src="js/features.js"></script>

    <script>
      require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/GraphicsLayer",
        "esri/widgets/Legend",
        "esri/widgets/ScaleBar",
        "esri/widgets/Compass",
        "esri/widgets/Home",
        "esri/widgets/LayerList",
      ], function (Map, MapView, GraphicsLayer, Legend, ScaleBar, Compass, Home, LayerList) {

        var map = new Map({
          basemap: "satellite"
        });

        var view = new MapView({
          container: "viewDiv",
          map: map,
          center: [106.677, 10.8115],
          zoom: 16,
          scale: 3000,
          popup: {
            dockEnabled: true,
            dockOptions: {
              position: "bottom-right",
              breakpoint: false,
              buttonEnabled: true
            }
          }
        });

        var loadingEl = document.getElementById("loading-overlay");

        var parkLayer = new GraphicsLayer({ title: "Công viên & Cảnh quan", listMode: "show" });
        var buildingLayer = new GraphicsLayer({ title: "Công trình LOD3.3", listMode: "show" });
        var detailLayer = new GraphicsLayer({ title: "Chi tiết kiến trúc (cửa sổ, cửa, cột)", listMode: "show" });
        var featureLayer = new GraphicsLayer({ title: "Tiện ích & Cây xanh", listMode: "show" });

        map.addMany([parkLayer, buildingLayer, detailLayer, featureLayer]);

        view.when(function () {
          if (typeof window.initParkBoundary === "function") window.initParkBoundary(parkLayer);
          if (typeof window.initBuildingsLOD3 === "function") window.initBuildingsLOD3(buildingLayer, detailLayer);
          if (typeof window.initFeatures === "function") window.initFeatures(featureLayer);

          var legend = new Legend({
            view: view,
            container: "legend-container",
            style: "card"
          });

          var scaleBar = new ScaleBar({ view: view, unit: "metric" });
          view.ui.add(scaleBar, "bottom-left");

          var layerList = new LayerList({ view: view });
          view.ui.add(layerList, "top-right");

          var homeBtn = new Home({ view: view });
          view.ui.add(homeBtn, "top-left");

          if (loadingEl) loadingEl.style.display = "none";

          console.log("✅ Map initialized – Công viên Gia Định, TP.HCM (LOD3.3)");
        }, function (err) {
          if (loadingEl) loadingEl.innerHTML = "<p style='color:#c0392b;padding:20px;'>Lỗi tải bản đồ: " + err + "</p>";
          console.error("❌ Map init error:", err);
        });
      });

      function toggleLegend() {
        var container = document.getElementById("legend-container");
        container.style.display = container.style.display === "none" ? "block" : "none";
      }
    </script>
  </body>
</html>
