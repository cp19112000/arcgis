<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản đồ 3D Park Güell – IE402 | Nhóm 1</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />

    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.29/"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="app-header">
      <div class="header-content">
        <div class="header-text">
          <h1 class="header-title">🏛️ Bản đồ 3D Park Güell – Antoni Gaudí</h1>
          <p class="header-subtitle">Hệ thống thông tin địa lý 3 chiều – IE402 | Nhóm 1: Chương – Mạnh – Hà – Phúc – Phát – Tiên La</p>
        </div>
      </div>
    </header>

    <div id="viewDiv"></div>

    <div id="legend-panel">
      <div id="legend-toggle" onclick="toggleLegend()">📖 Chú giải</div>
      <div id="legend-container"></div>
    </div>

    <script src="js/buildings.js"></script>
    <script src="js/structures.js"></script>
    <script src="js/features.js"></script>

    <script>
      require([
        "esri/WebScene",
        "esri/views/SceneView",
        "esri/layers/GraphicsLayer",
        "esri/widgets/Legend",
        "esri/widgets/ScaleBar",
        "esri/widgets/Compass",
        "esri/widgets/Home",
      ], function (WebScene, SceneView, GraphicsLayer, Legend, ScaleBar, Compass, Home) {

        var scene = new WebScene({
          basemap: "satellite",
          ground: "world-elevation"
        });

        var view = new SceneView({
          container: "viewDiv",
          map: scene,
          camera: {
            position: [2.1530, 41.4145, 380],
            tilt: 55,
            heading: 190
          },
          popup: {
            dockEnabled: true,
            dockOptions: {
              position: "bottom-right",
              breakpoint: false,
              buttonEnabled: true
            }
          },
          environment: {
            lighting: {
              date: new Date("March 15, 2026 10:00:00 GMT+1"),
              directShadows: true
            }
          }
        });

        var buildingLayer = new GraphicsLayer({ title: "Công trình kiến trúc" });
        var structureLayer = new GraphicsLayer({ title: "Cấu trúc & Cảnh quan" });
        var featureLayer = new GraphicsLayer({ title: "Điểm tiện ích" });

        scene.addMany([buildingLayer, structureLayer, featureLayer]);

        view.when(function () {
          if (typeof window.initBuildings === "function") window.initBuildings(buildingLayer);
          if (typeof window.initStructures === "function") window.initStructures(structureLayer);
          if (typeof window.initFeatures === "function") window.initFeatures(featureLayer);

          console.log("✅ Scene initialized – Park Güell, Barcelona");
        });

        view.when(function () {
          var legend = new Legend({
            view: view,
            container: "legend-container",
            style: "card"
          });

          var scaleBar = new ScaleBar({
            view: view,
            unit: "metric"
          });
          view.ui.add(scaleBar, "bottom-left");

          var compass = new Compass({ view: view });
          view.ui.add(compass, "top-right");

          var homeBtn = new Home({ view: view });
          view.ui.add(homeBtn, "top-left");
        });
      });

      function toggleLegend() {
        var container = document.getElementById("legend-container");
        container.style.display = container.style.display === "none" ? "block" : "none";
      }
    </script>
  </body>
</html>
